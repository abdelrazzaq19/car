name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        # Fails the build rather than reformatting, so the diff stays the
        # author's.
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        # The project is warning-clean, so anything new is a failure rather
        # than noise that accumulates.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle 9.1 is what the wrapper pins; 21 is the newest LTS it and
          # AGP 8.13 both support.
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        # Debug, not release: signing keys are not available to CI, and the
        # point here is that the Android target still compiles.
        run: flutter build apk --debug

  build-web:
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build web --no-tree-shake-icons
