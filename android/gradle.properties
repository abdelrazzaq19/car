org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false
# Flutter 3.47's Gradle plugin still reads AGP's legacy DSL: with the new one
# it fails casting ApplicationExtensionImpl to AbstractAppExtension. Stay on
# AGP 8 and the old DSL until Flutter supports AGP 9.
android.newDsl=false
